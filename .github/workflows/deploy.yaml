name: Deploy Workout Tracker
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-v2

      - name: Install musl tools
        run: sudo apt-get install -y musl-tools

      - name: Build release binary
        env:
          SQLX_OFFLINE: true
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Copy binary to VM
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          source: target/x86_64-unknown-linux-musl/release/telegram_bot
          target: /home/manojsk/
          debug: true

      - name: Install sqlx-cli
        uses: actions/cache@v4
        id: cache-sqlx
        with:
          path: ~/.cargo/bin/cargo-sqlx
          key: sqlx-cli-0.8.6

      - name: Install sqlx-cli if not cached
        if: steps.cache-sqlx.outputs.cache-hit != 'true'
        run: cargo install sqlx-cli --no-default-features --features postgres,rustls

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: cargo sqlx migrate run

      - name: Create .env on VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          debug: true
          script: |
            cat > /home/manojsk/.env << 'EOF'
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            EOF

      - name: Restart service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          debug: true
          script: |
            mv /home/manojsk/target/x86_64-unknown-linux-musl/release/telegram_bot /home/manojsk/telegram_bot
            chmod +x /home/manojsk/telegram_bot
            sudo systemctl restart telegram_bot
            sudo systemctl status telegram_bot
