name: Deploy Workout Tracker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-v2

      - name: Build release binary
        env:
          SQLX_OFFLINE: true
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Debug SSH key fingerprint
        run: |
          echo "${{ secrets.GCP_SSH_PRIVATE_KEY }}" > /tmp/debug_key
          chmod 600 /tmp/debug_key
          ssh-keygen -l -f /tmp/debug_key
          rm /tmp/debug_key

      - name: Debug host fingerprint
        run: |
          echo "Checking host fingerprint from runner"
          ssh-keyscan -t ed25519 ${{ secrets.GCP_VM_IP }} | ssh-keygen -lf -

      - name: Validate username and host
        run: |
          USERNAME='${{ secrets.GCP_VM_USER }}'
          HOST='${{ secrets.GCP_VM_IP }}'

          echo "Username length: $(printf "%s" "$USERNAME" | wc -c)"
          echo "Host length: $(printf "%s" "$HOST" | wc -c)"

          case "$USERNAME" in
            *$'\n'* ) echo "Username contains newline"; exit 1 ;;
            *" "*) echo "Username contains spaces"; exit 1 ;;
            "") echo "Username is empty"; exit 1 ;;
            *) echo "Username format OK" ;;
          esac

          case "$HOST" in
            *$'\n'* ) echo "Host contains newline"; exit 1 ;;
            "") echo "Host is empty"; exit 1 ;;
            *) echo "Host format OK" ;;
          esac

      - name: Compare host fingerprint
        run: |
          EXPECTED='${{ secrets.GCP_HOST_FINGERPRINT }}'
          ACTUAL=$(ssh-keyscan -t ed25519 ${{ secrets.GCP_VM_IP }} 2>/dev/null | ssh-keygen -lf - | awk '{print $2}')

          if [ "$EXPECTED" = "$ACTUAL" ]; then
            echo "MATCH"
          else
            echo "MISMATCH"
            exit 1
          fi

      - name: Copy binary to VM
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          source: target/x86_64-unknown-linux-gnu/release/telegram_bot
          target: /home/manojsk/
          debug: true

      - name: Create .env on VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          debug: true
          script: |
            cat > /home/manojsk/.env << 'EOF'
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            EOF

      - name: Restart service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          debug: true
          script: |
            mv /home/manojsk/target/x86_64-unknown-linux-gnu/release/telegram_bot /home/manojsk/telegram_bot
            chmod +x /home/manojsk/telegram_bot
            sudo systemctl restart telegram_bot
            sudo systemctl status telegram_bot
